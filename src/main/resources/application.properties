spring.application.name=ecommerce-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}

billplz.base-url=${BILLPLZ_BASE_URL:https://www.billplz-sandbox.com/api/}
billplz.secret-key=${BILLPLZ_SECRET_KEY:}
billplz.collection-id=${BILLPLZ_COLLECTION_ID:}

billplz.callback-url=${BILLPLZ_CALLBACK_URL:}
billplz.redirect-url=${BILLPLZ_REDIRECT_URL:http://localhost:5173/success}

billplz.x-signature-key=${BILLPLZ_X_SIGNATURE_KEY:}
